<!DOCTYPE html>
<html lang="en" class="dark">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Misan X Authentication Advanced Licensing</title>
  <link rel="icon" type="image/x-icon" href="/favicon.ico">
  <script src="https://cdn.tailwindcss.com"></script>
  <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;500;600;700;800;900&family=JetBrains+Mono:wght@400;700&display=swap"
    rel="stylesheet" />
  <script src="https://cdnjs.cloudflare.com/ajax/libs/crypto-js/4.1.1/crypto-js.min.js"></script>
  <script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
  <script>
    tailwind.config = {
      darkMode: 'class',
      theme: {
        extend: {
          fontFamily: { 
            sans: ['Outfit', 'sans-serif'],
            mono: ['JetBrains Mono', 'monospace']
          },
          colors: {
            background: '#020403',
            surface: '#050a08',
            surfaceHighlight: '#0a1410',
            border: '#11221b',
            primary: '#ffffff',
            muted: '#8fa89b',
            success: '#10b981',
            danger: '#ef4444',
            brand: {
              DEFAULT: '#10b981',
              glow: '#34d399',
              dark: '#064e3b',
              cyan: '#06b6d4'
            }
          },
          animation: {
            'fade-in': 'fadeIn 0.3s ease-out forwards',
            'slide-up': 'slideUp 0.4s cubic-bezier(0.16, 1, 0.3, 1) forwards'
          },
          keyframes: {
            fadeIn: { '0%': { opacity: '0' }, '100%': { opacity: '1' } },
            slideUp: { '0%': { opacity: '0', transform: 'translateY(20px)' }, '100%': { opacity: '1', transform: 'translateY(0)' } }
          }
        }
      }
    }
  </script>
  <style>
    body {
      background-color: #020403;
      color: #fff;
      overflow-x: hidden;
    }

    ::-webkit-scrollbar {
      width: 6px;
      height: 6px;
    }

    ::-webkit-scrollbar-track {
      background: transparent;
    }

    ::-webkit-scrollbar-thumb {
      background: #11221b;
      border-radius: 3px;
    }

    ::-webkit-scrollbar-thumb:hover {
      background: #16a34a;
    }

    .glass {
      background: rgba(5, 10, 8, 0.7);
      backdrop-filter: blur(10px);
      border: 1px solid #11221b;
    }

    .grid-bg {
      position: fixed;
      inset: 0;
      z-index: -1;
      pointer-events: none;
      opacity: 0.07;
      background-image: linear-gradient(#11221b 1px, transparent 1px), linear-gradient(90deg, #11221b 1px, transparent 1px);
      background-size: 50px 50px;
    }

    .blur-glow {
      position: fixed;
      z-index: -1;
      border-radius: 100%;
      filter: blur(120px);
      opacity: 0.02;
    }

    @keyframes float {
      0%, 100% { transform: translateY(0px); }
      50% { transform: translateY(-12px); }
    }
    @keyframes pulse-glow {
      0%, 100% { box-shadow: 0 0 15px rgba(16, 185, 129, 0.2); }
      50% { box-shadow: 0 0 35px rgba(16, 185, 129, 0.6); }
    }
    @keyframes gradient-move {
      0%, 100% { background-position: 0% 50%; }
      50% { background-position: 100% 50%; }
    }
    .animate-float {
      animation: float 6s ease-in-out infinite;
    }
    .animate-float-delayed {
      animation: float 6s ease-in-out infinite;
      animation-delay: 3s;
    }
    .animate-pulse-glow {
      animation: pulse-glow 3s infinite;
    }
    .animate-gradient-x {
      background-size: 200% 200%;
      animation: gradient-move 8s ease infinite;
    }
    .hover-glow-card {
      transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
    }
    .hover-glow-card:hover {
      box-shadow: 0 0 30px rgba(16, 185, 129, 0.15);
      border-color: rgba(16, 185, 129, 0.3) !important;
      transform: translateY(-6px) scale(1.015);
      background-color: rgba(16, 185, 129, 0.02) !important;
    }
  </style>
  <script type="importmap">
{
  "imports": {
    "react/": "https://esm.sh/react@^19.2.3/",
    "react": "https://esm.sh/react@^19.2.3",
    "firebase/": "https://esm.sh/firebase@^12.7.0/",
    "react-router-dom": "https://esm.sh/react-router-dom@^7.11.0",
    "react-dom/": "https://esm.sh/react-dom@^19.2.3/",
    "lucide-react": "https://esm.sh/lucide-react@^0.562.0"
  }
}
</script>
  <link rel="stylesheet" href="/index.css">
</head>

<body>
  <div id="root"></div>
  <div class="grid-bg"></div>
  <div class="blur-glow bg-emerald-600/8 w-[600px] h-[600px] top-[-10%] left-[-10%]"></div>
  <div class="blur-glow bg-teal-500/8 w-[500px] h-[500px] bottom-[-10%] right-[-10%]"></div>
  <script type="module" src="/index.tsx"></script>
</body>

</html>
